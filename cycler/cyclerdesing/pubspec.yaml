name: cyclerdesing
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^7.0.0
  firebase_core: ^5.0.0
  firebase_storage: ^14.1.0
  firebase_auth: ^7.0.1
  flex_color_scheme: ^8.4.0
  google_sign_in: ^6.2.1
  google_fonts: ^8.2.1
  google_maps_apis: ^5.1.0
  google_maps_flutter: ^2.10.0
  google_maps_webapi: ^0.0.24
  geolocator: ^14.1.2
  image_picker: ^1.1.2
  http: ^1.2.0
  flutter_svg: ^2.0.10
  flutter:
    sdk: flutter
  firebase_app_check: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/iconlauncher.png"
  min_sdk_android: 21
  adaptive_icon_background: "#5E6D28"
  adaptive_icon_foreground: "assets/icons/iconlauncher.png"
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600

    - family: DMMono
      fonts:
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500