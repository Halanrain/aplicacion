name: cyclerdesing
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^7.0.0
  firebase_core: ^5.0.0
  flex_color_scheme: ^8.4.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10
  geolocator: ^14.1.2
  google_fonts: ^8.2.1
  google_maps_flutter: ^2.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
          
    - family: DMMono
      fonts:
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
